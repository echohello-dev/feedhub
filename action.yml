name: feedhub
description: Poll RSS feeds and post new items to Discord
author: echohello-dev
branding:
  icon: rss
  color: orange

inputs:
  feeds-path:
    description: Path to feeds.json relative to the consumer repo root
    required: false
    default: feeds.json
  state-path:
    description: Path to state.json relative to the consumer repo root
    required: false
    default: state.json
  seed-only:
    description: Mark current items as seen without posting
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        working_directory: ${{ github.action_path }}
        log_level: warn

    - name: Sync feeds
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        FEEDHUB_FEEDS: ${{ github.workspace }}/${{ inputs.feeds-path }}
        FEEDHUB_STATE: ${{ github.workspace }}/${{ inputs.state-path }}
        FEEDHUB_REPO: ${{ github.workspace }}
        FEEDHUB_SEED_ONLY: ${{ inputs.seed-only }}
        MISE_LOG: warn
      run: mise run sync
