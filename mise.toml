[tools]
python = "3.12"
uv = "latest"

[tasks.default]
description = "List available tasks"
alias = "h"
run = ["mise tasks"]

[tasks.deps]
description = "Install Python deps with uv"
run = "uv pip install --system -r src/requirements.txt"

[tasks.poll]
description = "Poll feeds and post new items"
depends = ["deps"]
run = "python src/rss.py"

[tasks.seed]
description = "Mark current items seen without posting"
depends = ["deps"]
run = '''
export FEEDHUB_SEED_ONLY=true
python src/rss.py
'''

[tasks.commit-state]
description = "Commit and push state.json if it changed"
run = '''
repo="${FEEDHUB_REPO:-.}"
state="${FEEDHUB_STATE:-state.json}"
git -C "$repo" config user.name "github-actions[bot]"
git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git -C "$repo" add "$state"
git -C "$repo" diff --cached --quiet || git -C "$repo" commit -m "chore(feedhub): update RSS state"
git -C "$repo" push
'''

[tasks.sync]
description = "Poll or seed, then commit state (what CI runs)"
run = '''
if [ "${FEEDHUB_SEED_ONLY:-}" = "true" ]; then
  mise run seed
else
  mise run poll
fi
mise run commit-state
'''
